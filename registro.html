<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Academia Yudan</title>
    <link rel="stylesheet" href="css/style.css">
        <script src="js/cargarUsuarios.js" defer></script>
    <script src="js/registro.js" defer></script>
</head>
<body>

    <form id="formRegistro">
        
        <img src="img/logo.svg" alt="Logo" class="logo-form">
        <h2>Registro</h2>
        <input type="text" id="regNombre" placeholder="Nombre completo" required>
        <input type="text" id="regUsuario" placeholder="Nuevo usuario" required>
        <input type="password" id="regClave" placeholder="Nueva contraseña (mínimo 4 caracteres)" required>
        <input type="password" id="regClave2" placeholder="Repite la contraseña" required>
        <button type="submit">Registrarme</button>
        <p id="mensajeRegistro"></p>
        <a href="index.html">¿Ya tienes cuenta? Inicia sesión</a>
    
    </form>


</body>
</html>
